name: transcode-csharp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcode
      POSTGRES_PASSWORD: transcode
      POSTGRES_DB: transcode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcode"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "9000:9000"
      - "9001:9001"

  transcode-service:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: "3000"
      Postgres__ConnectionString: "Host=postgres;Database=transcode;Username=transcode;Password=transcode"
      Minio__Endpoint: "http://minio:9000"
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__Bucket: videos
    ports:
      - "3000:3000"
