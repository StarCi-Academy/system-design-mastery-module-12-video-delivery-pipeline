server:
  port: ${PORT:3000}

spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/transcode}
    username: ${POSTGRES_USER:transcode}
    password: ${POSTGRES_PASSWORD:transcode}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:videos}
  seed:
    source: ${SEED_SOURCE:}
    object: ${SEED_OBJECT:source/sample.mp4}
