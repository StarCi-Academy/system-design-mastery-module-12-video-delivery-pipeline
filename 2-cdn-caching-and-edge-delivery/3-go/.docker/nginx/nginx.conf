# Load the dynamically compiled cache purge module.
load_module modules/ngx_http_cache_purge_module.so;

events {}

http {
    # Declare a shared cache zone: 10MB metadata key store, 1GB max disk usage.
    # inactive=60m: remove entries not accessed within 60 minutes.
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn_cache:10m max_size=1g inactive=60m use_temp_path=off;

    # Cache key identity: request URI only, so the key is stable regardless of
    # the Host header. This lets a PURGE request (possibly with a different Host)
    # map to the same cached GET entry.
    proxy_cache_key "$request_uri";

    # Enable the PURGE method on the cdn_cache zone. A PURGE request to a content
    # URI evicts the entry whose key equals that URI. In production restrict this
    # with a "from <cidr>" clause so only the origin/admin network can purge.
    proxy_cache_purge PURGE from all;

    # Use Docker's embedded DNS so upstream hostnames are resolved at request
    # time, not at startup — prevents "host not found" when origin starts last.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        location /api/cdn/content/ {
            # Use a variable so NGINX defers DNS resolution to request time
            # (resolver 127.0.0.11 above). Prevents startup failure when
            # cdn-origin container is not yet registered in Docker DNS.
            set $cdn_origin http://cdn-origin:3000;
            proxy_pass         $cdn_origin;
            proxy_cache        cdn_cache;

            # Honour s-maxage from the origin response; fall back to 1 day.
            proxy_cache_valid  200 1d;
            # Ignore Vary so NGINX stores a single entry per URI key (no per-encoding
            # variants); this lets PURGE match the entry unconditionally.
            proxy_ignore_headers Vary;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
            proxy_cache_background_update on;
            proxy_cache_lock   on;

            # Expose cache status so clients can observe HIT / MISS / EXPIRED / UPDATING.
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
